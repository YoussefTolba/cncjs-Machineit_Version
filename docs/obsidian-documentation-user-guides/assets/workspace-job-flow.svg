<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <style>
      .bg{fill:#f7f9fb}.title{font:700 32px Arial,Helvetica,sans-serif;fill:#17202a}
      .box{fill:#fff;stroke:#cbd6e0;stroke-width:2;rx:14}.warn{fill:#fff7e6;stroke:#e5ba67;stroke-width:2;rx:14}.danger{fill:#fff0f0;stroke:#dc7d7d;stroke-width:2;rx:14}
      .label{font:700 21px Arial,Helvetica,sans-serif;fill:#1f2d3d}.small{font:400 15px Arial,Helvetica,sans-serif;fill:#3c4b5c}
      .arrow{stroke:#788896;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#788896"/></marker>
  </defs>
  <rect class="bg" width="1100" height="620"/>
  <text class="title" x="40" y="56">Job Control Flow In The Workspace</text>
  <g transform="translate(55 120)">
    <rect class="box" width="200" height="115"/><text class="label" x="34" y="40">Load File</text><text class="small" x="24" y="72">Upload or drag G-code</text><text class="small" x="24" y="94">into CNCjs.</text>
  </g>
  <path class="arrow" d="M260 178 H330"/>
  <g transform="translate(340 120)">
    <rect class="warn" width="200" height="115"/><text class="label" x="24" y="40">Preview</text><text class="small" x="24" y="72">Check origin, extents,</text><text class="small" x="24" y="94">Z moves, clamps.</text>
  </g>
  <path class="arrow" d="M545 178 H615"/>
  <g transform="translate(625 120)">
    <rect class="box" width="200" height="115"/><text class="label" x="38" y="40">Run</text><text class="small" x="24" y="72">Start only after zero</text><text class="small" x="24" y="94">and preview are right.</text>
  </g>
  <path class="arrow" d="M830 178 H900"/>
  <g transform="translate(910 120)">
    <rect class="danger" width="150" height="115"/><text class="label" x="38" y="40">Watch</text><text class="small" x="18" y="72">First plunge and</text><text class="small" x="18" y="94">first side cut.</text>
  </g>

  <g transform="translate(180 340)">
    <rect class="warn" width="230" height="140"/><text class="label" x="32" y="42">Feed Hold</text><text class="small" x="24" y="78">Controlled pause when</text><text class="small" x="24" y="102">motion looks wrong but</text><text class="small" x="24" y="126">there is no crash.</text>
  </g>
  <g transform="translate(450 340)">
    <rect class="box" width="230" height="140"/><text class="label" x="58" y="42">Resume</text><text class="small" x="24" y="78">Continue only after the</text><text class="small" x="24" y="102">machine, stock, and tool</text><text class="small" x="24" y="126">are safe.</text>
  </g>
  <g transform="translate(720 340)">
    <rect class="danger" width="230" height="140"/><text class="label" x="64" y="42">Abort</text><text class="small" x="24" y="78">Stop when continuing is</text><text class="small" x="24" y="102">unsafe. Use physical E-stop</text><text class="small" x="24" y="126">for immediate danger.</text>
  </g>
  <path class="arrow" d="M720 238 C700 300 330 300 300 335"/>
  <path class="arrow" d="M410 410 H440"/>
  <path class="arrow" d="M680 410 H710"/>
</svg>
